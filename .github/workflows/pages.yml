name: Publish site

# Publishes the site/ folder to GitHub Pages whenever main changes.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check before publishing
        run: npm run check
      - name: Stamp the version so browsers fetch fresh files
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(styles\.css|config\.js|app\.js)\"#\1=\"\2?v=$V\"#g" site/index.html
          sed -i -E "s#from \"\./(engine|planner)\.js\"#from \"./\1.js?v=$V\"#g" site/app.js site/planner.js
          sed -i "s#__ILAHI_VERSION__#$V#g" site/app.js
          grep -c "?v=$V" site/index.html site/app.js site/planner.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
